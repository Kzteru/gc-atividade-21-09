<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bloqueios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><h1 class="af-titulo mb-0">Bloqueios de agenda</h1><a class="btn btn-outline-primary" th:href="@{/horarios(profissionalId=${profissionalId})}">Voltar aos horários</a></div>
    <th:block th:replace="~{fragments/layout :: mensagens}"></th:block>
    <form th:if="${admin}" method="get" th:action="@{/bloqueios}" class="af-painel mb-4"><label class="form-label" for="profissionalId">Profissional</label><div class="d-flex gap-2"><select class="form-select" id="profissionalId" name="profissionalId" required><option value="">Selecione</option><option th:each="p : ${profissionais}" th:value="${p.id}" th:selected="${p.id == profissionalId}" th:text="${p.nome}">Profissional</option></select><button class="btn btn-outline-primary" type="submit">Abrir</button></div></form>
    <section th:if="${profissionalId != null}" class="af-painel mb-4"><h2 class="h4" th:text="${form.id == null} ? 'Adicionar bloqueio' : 'Editar bloqueio'">Adicionar bloqueio</h2>
        <form th:action="@{/bloqueios/salvar(profissionalId=${profissionalId})}" th:object="${form}" method="post"><input type="hidden" th:field="*{id}">
            <div class="row align-items-end"><div class="col-lg-3 mb-3"><label class="form-label" for="inicio">Início</label><input class="form-control" id="inicio" type="datetime-local" th:field="*{inicio}" required></div><div class="col-lg-3 mb-3"><label class="form-label" for="fim">Fim</label><input class="form-control" id="fim" type="datetime-local" th:field="*{fim}" required></div><div class="col-lg-4 mb-3"><label class="form-label" for="motivo">Motivo</label><input class="form-control" id="motivo" th:field="*{motivo}" maxlength="255" placeholder="Almoço, limpeza, compromisso..."></div><div class="col-lg-2 mb-3 d-flex gap-2"><button class="btn af-btn-primario" type="submit">Salvar</button><a th:if="${form.id != null}" class="btn btn-outline-secondary" th:href="@{/bloqueios(profissionalId=${profissionalId})}">Cancelar</a></div></div>
        </form>
    </section>
    <div th:if="${profissionalId != null and #lists.isEmpty(bloqueios)}" class="af-painel">Nenhum bloqueio cadastrado.</div>
    <div th:if="${profissionalId != null and not #lists.isEmpty(bloqueios)}" class="af-painel p-0 table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Início</th><th>Fim</th><th>Motivo</th><th>Ações</th></tr></thead><tbody>
        <tr th:each="b : ${bloqueios}"><td th:text="${#temporals.format(b.inicio, 'dd/MM/yyyy HH:mm')}">01/01/2027 12:00</td><td th:text="${#temporals.format(b.fim, 'dd/MM/yyyy HH:mm')}">01/01/2027 13:00</td><td th:text="${b.motivo} ?: '—'">Almoço</td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/bloqueios/{id}/editar(id=${b.id},profissionalId=${profissionalId})}">Editar</a><form class="d-inline" method="post" th:action="@{/bloqueios/{id}/excluir(id=${b.id},profissionalId=${profissionalId})}"><button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button></form></td></tr>
    </tbody></table></div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
