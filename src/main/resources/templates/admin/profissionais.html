<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profissionais')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="af-titulo mb-0">Profissionais</h1>
        <a class="btn af-btn-primario" th:href="@{/admin/profissionais/novo}">Cadastrar profissional</a>
    </div>

    <th:block th:replace="~{fragments/layout :: mensagens}"></th:block>

    <div th:if="${#lists.isEmpty(profissionais)}" class="af-painel">
        Nenhum profissional cadastrado. Cadastre o primeiro para que ele possa montar a agenda.
    </div>

    <div th:unless="${#lists.isEmpty(profissionais)}" class="af-painel p-0 table-responsive">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">E-mail</th>
                <th scope="col">Telefone</th>
                <th scope="col">Situação</th>
                <th scope="col"><span class="visually-hidden">Ações</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${profissionais}" th:classappend="${p.ativo} ? '' : 'af-inativo'">
                <td th:text="${p.nome}">Carlos</td>
                <td th:text="${p.email}">carlos@email.com</td>
                <td th:text="${p.telefone} ?: '—'">—</td>
                <td>
                    <span th:if="${p.ativo}" class="badge text-bg-success">Ativo</span>
                    <span th:unless="${p.ativo}" class="badge text-bg-secondary">Desativado</span>
                </td>
                <td class="text-end">
                    <form th:action="@{/admin/profissionais/{id}/ativo(id=${p.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-secondary"
                                th:text="${p.ativo} ? 'Desativar' : 'Reativar'">Desativar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
