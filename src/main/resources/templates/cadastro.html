<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body class="af-login">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <h1 class="af-marca">AgendaFácil</h1>
            <p class="text-body-secondary mb-4">Crie sua conta para marcar horários a qualquer hora do dia.</p>

            <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}">Erro.</div>

            <form th:action="@{/cadastro}" th:object="${form}" method="post" class="af-painel" novalidate>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid"
                           autocomplete="name" required autofocus>
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid"
                           autocomplete="email" required>
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone <span class="text-body-secondary">(opcional)</span></label>
                    <input type="tel" th:field="*{telefone}" class="form-control" th:errorclass="is-invalid"
                           autocomplete="tel" placeholder="(64) 99999-9999">
                    <div class="invalid-feedback" th:errors="*{telefone}"></div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" th:field="*{senha}" class="form-control" th:errorclass="is-invalid"
                               autocomplete="new-password" aria-describedby="ajudaSenha" required>
                        <div class="invalid-feedback" th:errors="*{senha}"></div>
                    </div>
                    <div class="col-sm-6">
                        <label for="confirmacaoSenha" class="form-label">Repita a senha</label>
                        <input type="password" th:field="*{confirmacaoSenha}" class="form-control"
                               th:errorclass="is-invalid" autocomplete="new-password" required>
                        <div class="invalid-feedback" th:errors="*{confirmacaoSenha}"></div>
                    </div>
                    <div id="ajudaSenha" class="form-text mt-1">Pelo menos 6 caracteres.</div>
                </div>
                <button type="submit" class="btn af-btn-primario w-100">Criar conta</button>
            </form>

            <p class="mt-3">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
