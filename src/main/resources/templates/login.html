<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body class="af-login">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <h1 class="af-marca">AgendaFácil</h1>
            <p class="text-body-secondary mb-4">Entre para marcar ou gerenciar seus horários.</p>

            <div th:if="${param.error}" class="alert alert-danger">E-mail ou senha incorretos.</div>
            <div th:if="${param.saiu}" class="alert alert-success">Você saiu da sua conta.</div>

            <form th:action="@{/login}" method="post" class="af-painel">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-control" required>
                </div>
                <button type="submit" class="btn af-btn-primario w-100">Entrar</button>
            </form>

            <p class="small text-body-secondary mt-4">
                Contas de teste (senha 123456): cliente@agendafacil.com,
                profissional@agendafacil.com e admin@agendafacil.com.
            </p>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
