<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Pedaços reaproveitados por TODAS as páginas.
  Como usar numa página nova:
    <head th:replace="~{fragments/layout :: head('Título da página')}"></head>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-5">
        <th:block th:replace="~{fragments/layout :: mensagens}"></th:block>
        ... conteúdo ...
    </main>
    <footer th:replace="~{fragments/layout :: rodape}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

  Mensagens: no controller, use
    model.addAttribute("erro", "...")                  (quando devolve a própria página)
    redirect.addFlashAttribute("sucesso", "...")       (quando faz redirect)
-->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | AgendaFácil'">AgendaFácil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark af-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">AgendaFácil</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                    <a class="nav-link" th:href="@{/agendamentos/novo}">Agendar</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                    <a class="nav-link" th:href="@{/agendamentos}">Meus agendamentos</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('PROFISSIONAL','ADMIN')">
                    <a class="nav-link" th:href="@{/agenda}">Minha agenda</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('PROFISSIONAL','ADMIN')">
                    <a class="nav-link" th:href="@{/servicos}">Serviços</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('PROFISSIONAL','ADMIN')">
                    <a class="nav-link" th:href="@{/horarios}">Horários e bloqueios</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('PROFISSIONAL','ADMIN')">
                    <a class="nav-link" th:href="@{/relatorios/clientes}">Relatórios</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/profissionais}">Profissionais</a>
                </li>
            </ul>
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3 af-conta">
                <a class="af-conta-link text-decoration-none" th:href="@{/perfil}">Meu perfil</a>
                <form th:action="@{/logout}" method="post" class="d-flex">
                    <button class="btn btn-sm af-btn-sair" type="submit">Sair</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<th:block th:fragment="mensagens">
    <div th:if="${sucesso}" class="alert alert-success" role="status" th:text="${sucesso}">Sucesso.</div>
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}">Erro.</div>
</th:block>

<footer th:fragment="rodape" class="af-rodape">
    <div class="container">AgendaFácil</div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
