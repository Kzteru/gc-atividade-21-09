spring.application.name=agendafacil

# ---------- Banco de dados (H2 salvo em arquivo na pasta ./data) ----------
spring.datasource.url=jdbc:h2:file:./data/agendafacil
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console do banco: http://localhost:8080/h2-console  (JDBC URL acima, usuario sa, sem senha)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- E-mail (dupla 5) ----------
# Nunca coloque a senha aqui. Defina as variaveis de ambiente MAIL_USERNAME e MAIL_PASSWORD.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Regras do negocio ----------
agendafacil.cancelamento.horas-antecedencia=24
