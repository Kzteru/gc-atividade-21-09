name: Build e testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9
      - name: Compilar e rodar testes
        run: mvn -B verify
